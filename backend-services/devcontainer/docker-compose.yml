services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    # Not published to the host: only openclaw/claude-code need it, via the
    # internal ai-net network (http://ollama:11434). Avoids clashing with a
    # native `ollama serve` on the host, which also wants port 11434.
    environment:
      # Keep a loaded model resident instead of unloading after Ollama's
      # default 5m idle timeout — avoids a slow cold reload on every message
      # after a short gap. Bump/lower to taste; "-1" keeps it loaded forever.
      - OLLAMA_KEEP_ALIVE=30m
      # Cap concurrent model instances to 1: on memory-constrained hosts,
      # letting two requests each load their own copy is what triggers OOM.
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-net
    restart: unless-stopped
    # Uncomment to enable GPU passthrough (requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  openclaw:
    build:
      context: ./openclaw
    image: openclaw:latest
    container_name: openclaw
    environment:
      - OLLAMA_API_KEY=ollama-local
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - openclaw_state:/home/vscode/.openclaw
      - ./openclaw/workspace:/home/vscode/workspace
    ports:
      - "18789:18789"
    networks:
      - ai-net
    depends_on:
      - ollama
    restart: unless-stopped
    command: ["openclaw", "gateway", "run", "--bind", "lan"]

  claude-code:
    build:
      context: ./claude-code
    image: claude-code:latest
    container_name: claude-code
    environment:
      - OPENAI_API_BASE=http://ollama:11434/v1
      - OPENAI_API_KEY=ollama-local
    volumes:
      - ./claude-code:/workspace
    networks:
      - ai-net
    depends_on:
      - ollama
    stdin_open: true
    tty: true

networks:
  ai-net:
    driver: bridge

volumes:
  ollama_data:
  openclaw_state:
