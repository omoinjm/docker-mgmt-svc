services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ollama
    image: ollama:latest
    restart: unless-stopped
    command: serve
    ports:
      - "11434:11434" # Ollama API Port
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/setup_models.sh:/scripts/setup_models.sh:ro
    networks:
      - ollama-net
    #      - nginx-proxy-manager_default
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - TZ=UTC

volumes:
  ollama_data:

networks:
  ollama-net:
    name: ollama-net
    driver: bridge
#  nginx-proxy-manager_default:
#   external: true
