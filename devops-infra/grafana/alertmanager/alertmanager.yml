route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "web.hook"

  routes:
    - match:
        severity: critical
      receiver: "critical"
      continue: true
    - match:
        alertname: "ZombieProcessDetected"
      receiver: "zombie-alert"

receivers:
  - name: "web.hook"
    webhook_configs:
      - url: "http://localhost:3000/api/webhooks/alert" # Can integrate with Grafana

  - name: "critical"
    webhook_configs:
      - url: "http://localhost:3000/api/webhooks/alert"

  - name: "zombie-alert"
    webhook_configs:
      - url: "http://localhost:3000/api/webhooks/alert"
    # Add email or Slack here if desired:
    # email_configs:
    #   - to: 'admin@example.com'
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/...'

  - name: "discord"
    # Optional: Add Discord webhook for alerts
    webhook_configs:
      - url: "${DISCORD_WEBHOOK_URL}"
        send_resolved: true
